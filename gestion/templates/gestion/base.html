<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Biblioteca{% endblock %} | Gestión de préstamos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    {% with url=request.resolver_match.url_name %}
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'inicio' %}">📚 Biblioteca</a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link {% if url == 'inicio' %}active{% endif %}" href="{% url 'inicio' %}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if 'autor' in url %}active{% endif %}" href="{% url 'lista_autores' %}">Autores</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if 'libro' in url %}active{% endif %}" href="{% url 'lista_libros' %}">Libros</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if 'socio' in url %}active{% endif %}" href="{% url 'lista_socios' %}">Socios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if 'prestamo' in url %}active{% endif %}" href="{% url 'lista_prestamos' %}">Préstamos</a>
                </li>
            </ul>
        </div>
    </nav>
    {% endwith %}

    <main class="container mb-5">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
